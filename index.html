<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autogestor — Gestión vehicular</title>
<meta name="theme-color" content="#F5F0E8" id="themeColorMeta">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ─── EARTHY THEME (default) ─────────────────────── */
:root{
  --bg:#F5F0E8;
  --panel:#FFFCF7;
  --panel-2:#EDE8DC;
  --line:#DDD5C2;
  --accent:#C25D3B;
  --accent-dim:#9E4A2E;
  --cool:#5B7B52;
  --text:#2A1F13;
  --text-dim:#8A7360;
  --danger:#B83232;
  --warn:#B87D0A;
  --good:#4A7C3F;
  --radius:12px;
  --font-display:'Fraunces',Georgia,serif;
  --bg-header:#EDE8DC;
  --bg-header-2:#F5F0E8;
  --bg-nav:#EDE8DC;
  --nav-border:#DDD5C2;
  --odo-bg:#2A1F13;
  --odo-border:#4A3828;
  --odo-text:#C25D3B;
  --odo-glow:rgba(194,93,59,0.45);
  --toast-bg:#2A1F13;
  --toast-text:#F5F0E8;
  --mark-1:#D4895A;
  --mark-2:#9E4A2E;
  --mark-icon:#FFFCF7;
  --btn-primary-text:#FFFCF7;
  --shadow:0 1px 3px rgba(42,31,19,0.10);
  --shadow-card:0 2px 8px rgba(42,31,19,0.07);
}

/* ─── DARK / AUTOMOTIVE THEME ───────────────────── */
html.theme-dark{
  --bg:#13151A;
  --panel:#1B1E25;
  --panel-2:#20242C;
  --line:#2C313B;
  --accent:#FF9F1C;
  --accent-dim:#C97D17;
  --cool:#4FC3D9;
  --text:#EDEAE3;
  --text-dim:#9AA0AC;
  --danger:#E2483D;
  --warn:#F2B705;
  --good:#6FCF7C;
  --font-display:'Rajdhani','Arial Narrow',sans-serif;
  --bg-header:#16181F;
  --bg-header-2:#13151A;
  --bg-nav:#16181F;
  --nav-border:#2C313B;
  --odo-bg:#0E0F13;
  --odo-border:#2A2E36;
  --odo-text:#FF9F1C;
  --odo-glow:rgba(255,159,28,0.50);
  --toast-bg:#2A2E36;
  --toast-text:#EDEAE3;
  --mark-1:#FFB84D;
  --mark-2:#C97D17;
  --mark-icon:#1A1206;
  --btn-primary-text:#1A1206;
  --shadow:0 1px 4px rgba(0,0,0,0.4);
  --shadow-card:0 2px 8px rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:78px;
  min-height:100vh;
  transition:background .25s, color .25s;
}
h1,h2,h3,.display{
  font-family:var(--font-display);
  font-weight:700;
  letter-spacing:0.01em;
}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:var(--cool);}
button{font-family:inherit;cursor:pointer;}

/* Header */
header.top{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--bg-header) 0%, var(--bg-header-2) 100%);
  border-bottom:1px solid var(--line);
  padding:14px 16px 10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .mark{
  width:36px;height:36px;border-radius:9px;
  background:linear-gradient(135deg, var(--mark-1), var(--mark-2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  flex:0 0 auto;
}
.brand .mark svg{width:20px;height:20px;}
.brand h1{font-size:22px;margin:0;line-height:1;}
html.theme-dark .brand h1{text-transform:uppercase;letter-spacing:0.05em;}
.brand .sub{font-size:11px;color:var(--text-dim);margin-top:1px;letter-spacing:0.03em;}
.car-chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:2px;}
.car-chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:7px 14px;border-radius:20px;
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-dim);
  white-space:nowrap;
}
.chip.active{
  background:color-mix(in srgb, var(--accent) 15%, transparent);
  border-color:var(--accent-dim);color:var(--accent);
}

main{padding:16px;max-width:720px;margin:0 auto;}
.section{display:none;}
.section.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* Cards */
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  box-shadow:var(--shadow-card);
}
.card h3{
  margin:0 0 12px;font-size:11.5px;color:var(--text-dim);
  text-transform:uppercase;letter-spacing:0.07em;font-weight:600;
  font-family:'Inter',sans-serif;
}

/* Odometer hero */
.hero-row{display:flex;gap:12px;margin-bottom:14px;}
.hero-card{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-card);
  position:relative;overflow:hidden;
}
.hero-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:10px;font-weight:600;}
.hero-car-img{
  position:absolute;right:-4px;bottom:-4px;
  height:90px;max-width:55%;object-fit:contain;
  opacity:0.88;pointer-events:none;
}
/* Bird's-eye tire map */
.tire-map-wrap{margin-bottom:14px;display:flex;justify-content:center;}
.tire-map-wrap svg{max-width:200px;width:100%;}
/* Flat-log section inside tire card */
.flat-log-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.flat-row{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center;}
.flat-row:last-child{border-bottom:none;}
.flat-cause{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);flex:0 0 auto;}
.odometer{display:flex;gap:3px;flex-wrap:wrap;}
.odo-digit{
  background:var(--odo-bg);border:1px solid var(--odo-border);border-radius:4px;
  padding:6px 2px;min-width:22px;text-align:center;
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;
  color:var(--odo-text);text-shadow:0 0 10px var(--odo-glow);
}
.odo-digit.sep{background:transparent;border:none;color:var(--text-dim);min-width:6px;text-shadow:none;font-size:16px;}
.odo-unit{font-size:11px;color:var(--text-dim);margin-top:6px;letter-spacing:0.04em;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px;box-shadow:var(--shadow-card);
}
.stat .label{font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;}
.stat .value{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;color:var(--text);margin-top:5px;}
.stat .value.cool{color:var(--cool);}

/* Alerts */
.alert-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.alert-item:last-child{border-bottom:none;}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
.dot.bad{background:var(--danger);box-shadow:0 0 5px color-mix(in srgb, var(--danger) 60%, transparent);}
.dot.warn{background:var(--warn);box-shadow:0 0 5px color-mix(in srgb, var(--warn) 60%, transparent);}
.dot.good{background:var(--good);}
.alert-item .txt{flex:1;}
.alert-item .name{font-weight:600;font-size:14px;}
.alert-item .meta{font-size:12px;color:var(--text-dim);}
.empty{color:var(--text-dim);font-size:13px;padding:8px 0;}

/* Lists / feed */
.feed-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.feed-item:last-child{border-bottom:none;}
.feed-icon{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.feed-icon svg{width:15px;height:15px;stroke:var(--cool);}
.feed-main{flex:1;min-width:0;}
.feed-main .t1{font-size:13.5px;font-weight:600;}
.feed-main .t2{font-size:12px;color:var(--text-dim);}
.feed-cost{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:700;white-space:nowrap;color:var(--text);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:9px;border:none;
  font-weight:600;font-size:14px;
}
.btn-primary{background:var(--accent);color:var(--btn-primary-text);}
.btn-primary:active{background:var(--accent-dim);}
.btn-ghost{background:var(--panel-2);color:var(--text);border:1px solid var(--line);}
.btn-danger{
  background:color-mix(in srgb, var(--danger) 12%, transparent);
  color:var(--danger);
  border:1px solid color-mix(in srgb, var(--danger) 35%, transparent);
}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:7px;}
.fab-row{display:flex;gap:8px;margin-bottom:14px;}

/* Entity cards */
.entity{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow-card);
}
.entity-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.entity-head .name{font-size:17px;font-weight:700;font-family:var(--font-display);}
.entity-head .sub{font-size:12.5px;color:var(--text-dim);margin-top:1px;}
.entity-actions{display:flex;gap:6px;flex:0 0 auto;}
.icon-btn{width:30px;height:30px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:14px;height:14px;stroke:var(--text-dim);}
.entity-stats{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;}
.entity-stats div{font-size:12.5px;color:var(--text-dim);}
.entity-stats .v{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);display:block;margin-top:2px;}

/* Table-like rows */
.row-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.row-item:last-child{border-bottom:none;}
.row-item .badge{font-size:10px;padding:3px 8px;border-radius:5px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;flex:0 0 auto;}
.badge-mant{background:color-mix(in srgb, var(--cool) 18%, transparent);color:var(--cool);}
.badge-rep{background:color-mix(in srgb, var(--good) 18%, transparent);color:var(--good);}
.badge-acc{background:color-mix(in srgb, var(--accent) 18%, transparent);color:var(--accent);}
.badge-seg{background:color-mix(in srgb, var(--text-dim) 18%, transparent);color:var(--text-dim);}
.badge-otro{background:color-mix(in srgb, var(--danger) 12%, transparent);color:var(--danger);}
.row-main{flex:1;min-width:0;}
.row-main .l1{font-size:13.5px;font-weight:600;}
.row-main .l2{font-size:12px;color:var(--text-dim);}
.row-cost{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;text-align:right;flex:0 0 auto;}
.row-cost .sub{display:block;font-size:11px;color:var(--text-dim);font-weight:400;}

/* Status badges for maintenance */
.status-badge{font-size:10.5px;padding:3px 9px;border-radius:6px;font-weight:700;}
.status-ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good);}
.status-soon{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);}
.status-due{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger);}

/* Forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:11px 12px;font-size:14.5px;font-family:inherit;
  transition:border-color .15s, outline .15s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-dim);outline-offset:1px;border-color:var(--accent-dim);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.checkbox-field input{width:18px;height:18px;accent-color:var(--accent);}
.checkbox-field label{margin:0;font-size:13.5px;color:var(--text);font-weight:500;}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  display:none;align-items:flex-end;justify-content:center;z-index:100;
  backdrop-filter:blur(2px);
}
.overlay.show{display:flex;}
.modal{
  background:var(--bg);border:1px solid var(--line);
  border-radius:18px 18px 0 0;width:100%;max-width:520px;
  max-height:88vh;overflow-y:auto;padding:18px 18px 28px;
  animation:slideup .2s ease;
  box-shadow:0 -4px 24px rgba(0,0,0,0.12);
}
@keyframes slideup{from{transform:translateY(40px);opacity:0;}to{transform:none;opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-head h3{margin:0;font-size:19px;font-family:var(--font-display);}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:24px;line-height:1;padding:4px;}

/* Bottom nav */
nav.bottom{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--bg-nav);
  border-top:1px solid var(--nav-border);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.bottom button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 2px;color:var(--text-dim);font-size:10px;font-weight:600;border-radius:8px;
  letter-spacing:0.02em;
}
nav.bottom button svg{width:20px;height:20px;stroke:var(--text-dim);fill:none;stroke-width:1.8;}
nav.bottom button.active{color:var(--accent);}
nav.bottom button.active svg{stroke:var(--accent);}

/* Chart */
canvas{width:100%;display:block;}

/* Toast */
#toast{
  position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--toast-bg);color:var(--toast-text);
  padding:11px 18px;border-radius:9px;
  font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;
  border:1px solid var(--line);white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.section-title h2{font-size:22px;margin:0;}
.select-inline{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;}

.help-text{font-size:12.5px;color:var(--text-dim);line-height:1.6;margin-bottom:14px;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* Year separators */
.year-sep{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 0 8px;margin-top:4px;
  border-bottom:2px solid var(--line);
}
.year-sep .y{font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--accent);}
.year-sep .t{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--text-dim);}

/* Sub-tabs (pills) */
.subtabs{display:flex;gap:8px;margin-bottom:14px;}
.subtab{
  flex:1;text-align:center;padding:9px 0;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--text-dim);
  cursor:pointer;
}
.subtab.active{
  background:color-mix(in srgb, var(--accent) 15%, transparent);
  border-color:var(--accent-dim);color:var(--accent);
}

/* Multi-select checklist */
.check-list{display:flex;flex-direction:column;gap:8px;max-height:200px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:10px;}
.check-item{display:flex;align-items:center;gap:9px;}
.check-item input{width:18px;height:18px;flex:0 0 auto;accent-color:var(--accent);}
.check-item label{font-size:13.5px;margin:0;color:var(--text);}

/* Category manager */
.cat-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-row .cat-name{flex:1;font-size:14px;font-weight:600;}
.cat-row .cat-count{font-size:11.5px;color:var(--text-dim);}

/* Import preview */
.import-table{width:100%;font-size:12.5px;border-collapse:collapse;margin-top:6px;}
.import-table th{text-align:left;color:var(--text-dim);font-weight:600;padding:6px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;}
.import-table td{padding:6px;border-bottom:1px solid var(--line);font-family:'JetBrains Mono',monospace;}
.import-table tr.skip td{color:var(--text-dim);text-decoration:line-through;opacity:0.6;}
.import-summary{display:flex;gap:14px;margin:10px 0;font-size:12.5px;}
.import-summary b{color:var(--text);}
.scrollx{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;}

/* Tire cards */
.tire-pos-badge{font-size:10px;padding:3px 8px;border-radius:5px;font-weight:700;background:color-mix(in srgb,var(--cool) 15%,transparent);color:var(--cool);text-transform:uppercase;}

/* Theme toggle */
.theme-option{
  display:flex;align-items:center;gap:12px;padding:12px;
  border:2px solid var(--line);border-radius:10px;cursor:pointer;
  background:var(--panel-2);margin-bottom:10px;
}
.theme-option.selected{border-color:var(--accent);}
.theme-swatch{width:36px;height:36px;border-radius:8px;flex:0 0 auto;border:1px solid rgba(0,0,0,0.1);}
.theme-swatch.earthy{background:linear-gradient(135deg,#F5F0E8,#C25D3B);}
.theme-swatch.dark{background:linear-gradient(135deg,#13151A,#FF9F1C);}
.theme-option-text .t1{font-size:14px;font-weight:600;}
.theme-option-text .t2{font-size:12px;color:var(--text-dim);}
/* Vehicle type badges */
.vtype-auto  {background:color-mix(in srgb,var(--cool) 18%,transparent);color:var(--cool);}
.vtype-moto  {background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);}
.vtype-bici  {background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);}
.vtype-otro  {background:color-mix(in srgb,var(--text-dim) 18%,transparent);color:var(--text-dim);}
.vtype-badge {font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;text-transform:uppercase;}
/* Vehicle switcher in header */
.vswitcher{
  margin-left:auto;flex:0 0 auto;
  display:flex;align-items:center;gap:5px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--text);
}
.vswitcher svg{width:13px;height:13px;stroke:var(--text-dim);}
/* Place quick-tap pill */
.place-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--panel-2);border:1px solid var(--line);
  border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600;
  cursor:pointer;margin:0 6px 8px 0;
}
.place-pill:active{background:color-mix(in srgb,var(--accent) 14%,transparent);}
.place-pill .km{color:var(--text-dim);font-size:11px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand">

<script>
/* ============== STORAGE ============== */
const DB_KEY = 'autogestor_v1';
const DEFAULT_CATEGORIES = ['Mantenimiento','Repuesto','Accesorio','Seguro','Impuestos/Documentación','Lavado/Detailing','Otro'];
let DB = loadDB();
let currentVehicleId = null; // currently selected vehicle id
let activeSection = 'dashboard';
const VEHICLE_ID_KEY = 'autogestor_vehicle';

function defaultDB(){ return { cars: [], fuel: [], expenses: [], maint: [], tires: [], trips: [], places: [], categories: [...DEFAULT_CATEGORIES] }; }
function loadDB(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return defaultDB();
    const parsed = JSON.parse(raw);
    const db = Object.assign(defaultDB(), parsed);
    // Migrate: add trips/places if missing
    if(!db.trips) db.trips=[];
    if(!db.places) db.places=[];
    return db;
  }catch(e){ console.error('Error cargando datos', e); return defaultDB(); }
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ============== THEME ============== */
const THEME_KEY = 'autogestor_theme';
function applyTheme(name, save){
  if(name==='dark'){
    document.documentElement.classList.add('theme-dark');
    document.getElementById('themeColorMeta').content = '#13151A';
  } else {
    document.documentElement.classList.remove('theme-dark');
    document.getElementById('themeColorMeta').content = '#F5F0E8';
  }
  if(save) localStorage.setItem(THEME_KEY, name);
}
applyTheme(localStorage.getItem(THEME_KEY)||'earthy', false);

/* ============== FORMAT HELPERS ============== */
function numFmt(n, decimals=0){
  n = Number(n)||0;
  const sign = n<0 ? '-':'';
  n = Math.abs(n);
  const parts = n.toFixed(decimals).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return sign + parts.join(',');
}
function fmtGs(n){ return '₲ ' + numFmt(n,0); }
function fmtKm(n){ return numFmt(n,0) + ' km'; }
function fmtL(n){ return numFmt(n,1) + ' L'; }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('es-PY', {day:'2-digit',month:'short',year:'numeric'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthsBetween(d1,d2){
  const a=new Date(d1), b=new Date(d2);
  return Math.max(0,(b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()) + (b.getDate()>=a.getDate()?0:-1));
}
function odometerHTML(value, decimals=0){
  const formatted = numFmt(Number(value)||0, decimals); // uses es-PY dots as thousand sep
  let html = '';
  for(const ch of formatted){
    if(ch==='.'||ch===','){ html += `<div class="odo-digit sep">${ch}</div>`; }
    else { html += `<div class="odo-digit">${ch}</div>`; }
  }
  return html;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ============== DEFAULT MAINTENANCE TEMPLATES ============== */
/* ── VEHICLE TYPE HELPERS ── */
const VTYPE_META = {
  auto: {label:'Auto',       icon:'🚗', tirePositions:['Delantera izquierda','Delantera derecha','Trasera izquierda','Trasera derecha']},
  moto: {label:'Moto',       icon:'🏍️', tirePositions:['Delantera','Trasera']},
  bici: {label:'Bicicleta',  icon:'🚲', tirePositions:['Delantera','Trasera']},
  otro: {label:'Otro',       icon:'🛴', tirePositions:['Delantera','Trasera','Posición 3','Posición 4']},
};
function vehicleType(carId){ return getCar(carId)?.type||'auto'; }
function vehicleMeta(carId){ return VTYPE_META[vehicleType(carId)]||VTYPE_META.auto; }
function tirePositionsFor(carId){ return vehicleMeta(carId).tirePositions; }
function vehicleHasFuel(carId){ return vehicleType(carId)!=='bici'; }

// Init current vehicle
function initCurrentVehicle(){
  const saved = localStorage.getItem(VEHICLE_ID_KEY);
  if(saved && DB.cars.find(c=>c.id===saved)) currentVehicleId=saved;
  else if(DB.cars.length>0) currentVehicleId=DB.cars[0].id;
  else currentVehicleId=null;
}
function setCurrentVehicle(id){
  currentVehicleId=id;
  localStorage.setItem(VEHICLE_ID_KEY,id);
  updateNavForVehicle();
  renderAll();
}
function updateNavForVehicle(){
  const type = vehicleType(currentVehicleId);
  const isBici = type==='bici';
  const navFuel = document.getElementById('nav-fuel');
  const navTrips = document.getElementById('nav-trips');
  if(navFuel) navFuel.style.display = isBici?'none':'';
  if(navTrips) navTrips.style.display = isBici?'':'none';
  // Update vehicle switcher label
  const car = getCar(currentVehicleId);
  const label = document.getElementById('vsLabel');
  if(label) label.textContent = car ? (VTYPE_META[car.type||'auto']?.icon||'')+ ' ' + car.alias : '— Sin vehículo —';
}

/* ── MAINTENANCE TEMPLATES BY TYPE ── */
const MAINT_TEMPLATES = {
  auto:[
    {name:'Cambio de aceite y filtro', intervalKm:10000, intervalMonths:12},
    {name:'Rotación de neumáticos', intervalKm:10000, intervalMonths:null},
    {name:'Filtro de aire', intervalKm:15000, intervalMonths:null},
    {name:'Filtro de combustible', intervalKm:20000, intervalMonths:null},
    {name:'Bujías', intervalKm:30000, intervalMonths:null},
    {name:'Líquido de frenos', intervalKm:null, intervalMonths:24},
    {name:'Correa / cadena de distribución', intervalKm:60000, intervalMonths:60},
    {name:'Batería', intervalKm:null, intervalMonths:48},
    {name:'Alineación y balanceo', intervalKm:10000, intervalMonths:null},
  ],
  moto:[
    {name:'Cambio de aceite y filtro', intervalKm:3000, intervalMonths:6},
    {name:'Ajuste y lubricación de cadena', intervalKm:1000, intervalMonths:2},
    {name:'Revisión de frenos', intervalKm:5000, intervalMonths:6},
    {name:'Bujías', intervalKm:8000, intervalMonths:12},
    {name:'Filtro de aire', intervalKm:10000, intervalMonths:12},
    {name:'Líquido de frenos', intervalKm:null, intervalMonths:24},
    {name:'Neumáticos', intervalKm:15000, intervalMonths:null},
    {name:'Batería', intervalKm:null, intervalMonths:36},
  ],
  bici_base:[
    {name:'Lubricación de cadena', intervalKm:300, intervalMonths:2},
    {name:'Revisión de neumáticos (presión y estado)', intervalKm:null, intervalMonths:1},
    {name:'Ajuste y revisión de frenos', intervalKm:800, intervalMonths:3},
    {name:'Tensión y centrado de ruedas (radios)', intervalKm:null, intervalMonths:12},
    {name:'Limpieza general de la bici', intervalKm:null, intervalMonths:3},
  ],
  bici_gears:[
    {name:'Ajuste de desviadores (frente y atrás)', intervalKm:1000, intervalMonths:6},
    {name:'Limpieza de cassette y platos', intervalKm:500, intervalMonths:3},
    {name:'Reemplazo de cables de cambio', intervalKm:null, intervalMonths:24},
  ],
  bici_disco:[
    {name:'Inspección de pastillas de freno de disco', intervalKm:2000, intervalMonths:6},
    {name:'Revisión de rotores', intervalKm:5000, intervalMonths:12},
  ],
  bici_vbrake:[
    {name:'Reemplazo de pastillas de freno (llanta)', intervalKm:2000, intervalMonths:12},
  ],
  bici_retropedal:[
    {name:'Mantenimiento del buje de freno retropedal', intervalKm:null, intervalMonths:24},
  ],
  otro:[],
};
// Keep backward-compat alias
const DEFAULT_MAINT_TEMPLATES = MAINT_TEMPLATES.auto;

function maintTemplatesFor(carId){
  const car = getCar(carId);
  const type = car?.type||'auto';
  if(type==='moto') return MAINT_TEMPLATES.moto;
  if(type==='auto') return MAINT_TEMPLATES.auto;
  if(type==='bici'){
    const cfg = car?.config||{};
    let list = [...MAINT_TEMPLATES.bici_base];
    if(cfg.gears) list.push(...MAINT_TEMPLATES.bici_gears);
    if(cfg.brakeType==='disco') list.push(...MAINT_TEMPLATES.bici_disco);
    else if(cfg.brakeType==='vbrake') list.push(...MAINT_TEMPLATES.bici_vbrake);
    else if(cfg.brakeType==='retropedal') list.push(...MAINT_TEMPLATES.bici_retropedal);
    return list;
  }
  return [];
}

/* ============== DATA QUERIES ============== */
function getCar(id){ return DB.cars.find(c=>c.id===id); }
function carsList(){ return DB.cars; }
function fuelByCar(carId){ return DB.fuel.filter(f=>f.carId===carId).sort((a,b)=>a.km-b.km); }
function expensesByCar(carId){ return DB.expenses.filter(e=>e.carId===carId); }
function maintByCar(carId){ return DB.maint.filter(m=>m.carId===carId); }

function carCurrentKm(carId){
  const car = getCar(carId); if(!car) return 0;
  if((car.type||'auto')==='bici'){
    // Bikes have no odometer — km comes from logged trips
    const tripKm = DB.trips.filter(t=>t.carId===carId)
      .reduce((s,t)=>s+(t.roundTrip?2:1)*(t.km||0),0);
    return (car.kmAtPurchase||0) + tripKm;
  }
  let max = car.kmAtPurchase||0;
  DB.fuel.forEach(f=>{ if(f.carId===carId && f.km>max) max=f.km; });
  DB.expenses.forEach(e=>{ if(e.carId===carId && e.km!=null && e.km>max) max=e.km; });
  return max;
}
function carFuelCost(carId){ return DB.fuel.filter(f=>f.carId===carId).reduce((s,f)=>s+Number(f.totalCost||0),0); }
function carExpenseCost(carId){ return DB.expenses.filter(e=>e.carId===carId).reduce((s,e)=>s+Number(e.cost||0),0); }
function carOperatingCost(carId){ return carFuelCost(carId)+carExpenseCost(carId); }
function carTotalCost(carId){ const car=getCar(carId); return (car?Number(car.purchasePrice||0):0) + carOperatingCost(carId); }
function carDistanceTraveled(carId){
  const car=getCar(carId); if(!car) return 0;
  return Math.max(0, carCurrentKm(carId) - (car.kmAtPurchase||0));
}
function carCostPerKm(carId, includePurchase=true){
  const dist = carDistanceTraveled(carId);
  if(dist<=0) return 0;
  const cost = includePurchase ? carTotalCost(carId) : carOperatingCost(carId);
  return cost/dist;
}
function carMonthsOwned(carId){
  const car=getCar(carId); if(!car || !car.purchaseDate) return 0;
  return Math.max(1, monthsBetween(car.purchaseDate, todayStr()));
}
// Monthly/annual averages include total cost (purchase + operating) spread over ownership period
function carMonthlyAvg(carId){ return carTotalCost(carId)/carMonthsOwned(carId); }
function carAnnualAvg(carId){ return carMonthlyAvg(carId)*12; }

function carFuelEfficiency(carId){
  // returns avg km/L using consecutive FULL-TANK entries sorted by km
  const entries = fuelByCar(carId).filter(f=>f.fullTank);
  if(entries.length<2) return null;
  let totalKm=0, totalL=0;
  for(let i=1;i<entries.length;i++){
    const dKm = entries[i].km - entries[i-1].km;
    if(dKm>0){ totalKm+=dKm; totalL+=Number(entries[i].liters||0); }
  }
  if(totalL<=0) return null;
  return totalKm/totalL;
}
function carAvgFuelPrice(carId){
  const entries = fuelByCar(carId);
  let totalCost=0, totalL=0;
  entries.forEach(f=>{ totalCost+=Number(f.totalCost||0); totalL+=Number(f.liters||0); });
  if(totalL<=0) return 0;
  return totalCost/totalL;
}

function maintNextDue(item){
  const carKm = carCurrentKm(item.carId);
  let dueKm = null, dueDate = null;
  if(item.intervalKm){
    const base = item.lastDoneKm!=null ? item.lastDoneKm : (getCar(item.carId)?.kmAtPurchase||0);
    dueKm = base + Number(item.intervalKm);
  }
  if(item.intervalMonths){
    const base = item.lastDoneDate || getCar(item.carId)?.purchaseDate || todayStr();
    const d = new Date(base); d.setMonth(d.getMonth()+Number(item.intervalMonths));
    dueDate = d.toISOString().slice(0,10);
  }
  let status = 'ok'; // ok | soon | due
  let remainingKm = dueKm!=null ? dueKm-carKm : null;
  let overdueByDate = dueDate!=null && new Date(dueDate) < new Date(todayStr());

  if((remainingKm!=null && remainingKm<=0) || overdueByDate) status='due';
  else if((remainingKm!=null && remainingKm<=1000) || (dueDate!=null && monthsBetween(todayStr(),dueDate)<1)) status='soon';

  return { dueKm, dueDate, status, remainingKm };
}

/* ============== CASCADE DELETE ============== */
function deleteCar(carId){
  DB.cars = DB.cars.filter(c=>c.id!==carId);
  DB.fuel = DB.fuel.filter(f=>f.carId!==carId);
  DB.expenses = DB.expenses.filter(e=>e.carId!==carId);
  DB.maint = DB.maint.filter(m=>m.carId!==carId);
  DB.tires = DB.tires.filter(t=>t.carId!==carId);
  DB.trips = DB.trips.filter(t=>t.carId!==carId);
  DB.places = DB.places.filter(p=>p.carId!==carId);
  if(currentVehicleId===carId){
    currentVehicleId = DB.cars[0]?.id||null;
    if(currentVehicleId) localStorage.setItem(VEHICLE_ID_KEY,currentVehicleId);
  }
  saveDB();
}

/* ============== NAVIGATION ============== */
document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=>goSection(btn.dataset.sec));
});
function goSection(sec){
  // If trying to go to fuel on a bike, redirect to trips
  if(sec==='fuel' && currentVehicleId && vehicleType(currentVehicleId)==='bici') sec='trips';
  // If trying to go to trips on a non-bike, redirect to fuel
  if(sec==='trips' && currentVehicleId && vehicleType(currentVehicleId)!=='bici') sec='fuel';
  activeSection = sec;
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  const secEl = document.getElementById('sec-'+sec);
  if(secEl) secEl.classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.sec===sec));
  renderAll();
  window.scrollTo(0,0);
}

/* ============== VEHICLE SWITCHER ============== */
function renderCarChips(){ /* no-op, replaced by updateNavForVehicle */ }
function openVehiclePicker(){
  if(DB.cars.length===0){ goSection('cars'); return; }
  const rows = DB.cars.map(c=>{
    const meta = VTYPE_META[c.type||'auto']||VTYPE_META.auto;
    const isActive = c.id===currentVehicleId;
    return `<div onclick="setCurrentVehicle('${c.id}');closeModal();"
      style="display:flex;align-items:center;gap:12px;padding:13px 12px;cursor:pointer;
             border-radius:10px;margin-bottom:6px;
             background:${isActive?'color-mix(in srgb,var(--accent) 12%,transparent)':'var(--panel-2)'};
             border:1.5px solid ${isActive?'var(--accent)':'var(--line)'}">
      <span style="font-size:22px">${meta.icon}</span>
      <div style="flex:1">
        <div style="font-weight:700;font-size:15px">${escapeHtml(c.alias)}</div>
        <div style="font-size:12px;color:var(--text-dim)">${meta.label}${c.brand?' · '+escapeHtml(c.brand):''} ${c.year?c.year:''}</div>
      </div>
      ${isActive?'<span style="color:var(--accent);font-size:18px">✓</span>':''}
    </div>`;
  }).join('');
  openModal(`<div class="modal">
    <div class="modal-head"><h3>Seleccionar vehículo</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    ${rows}
    <button class="btn btn-ghost btn-block" style="margin-top:6px" onclick="closeModal();goSection('cars')">+ Agregar vehículo</button>
  </div>`);
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============== MODAL HELPERS ============== */
function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="overlay show" id="ov">${html}</div>`;
  document.getElementById('ov').addEventListener('click', e=>{ if(e.target.id==='ov') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ============== RENDER: DASHBOARD ============== */
function renderDashboard(){
  const el = document.getElementById('sec-dashboard');
  const filterCars = currentVehicleId ? DB.cars.filter(c=>c.id===currentVehicleId) : DB.cars;
  const carIds = filterCars.map(c=>c.id);

  if(DB.cars.length===0){
    el.innerHTML = `<div class="card"><h3>Bienvenido</h3><p class="help-text">Todavía no agregaste ningún vehículo. Agregá tu auto, moto o bicicleta para llevar el control de costos, mantenimiento y recorridos.</p><button class="btn btn-primary btn-block" onclick="goSection('cars')">Agregar mi primer vehículo</button></div>`;
    return;
  }

  const totalCost = carIds.reduce((s,id)=>s+carTotalCost(id),0);
  const totalOperating = carIds.reduce((s,id)=>s+carOperatingCost(id),0);
  const totalDist = carIds.reduce((s,id)=>s+carDistanceTraveled(id),0);
  const costPerKm = totalDist>0 ? totalOperating/totalDist : 0;
  const monthlyAvg = carIds.reduce((s,id)=>s+carMonthlyAvg(id),0);
  const annualAvg = monthlyAvg*12;

  // fuel efficiency (only meaningful per-car when single car selected)
  let effHtml = '—';
  if(filterCars.length===1){
    const eff = carFuelEfficiency(filterCars[0].id);
    effHtml = eff!=null ? numFmt(eff,1)+' km/L' : 'Sin datos suficientes';
  } else {
    const effs = filterCars.map(c=>carFuelEfficiency(c.id)).filter(e=>e!=null);
    effHtml = effs.length ? numFmt(effs.reduce((a,b)=>a+b,0)/effs.length,1)+' km/L (prom.)' : 'Sin datos suficientes';
  }

  // maintenance alerts
  let alerts = [];
  carIds.forEach(id=>{
    maintByCar(id).forEach(item=>{
      const r = maintNextDue(item);
      if(r.status!=='ok'){
        alerts.push({carName:getCar(id).alias, name:item.name, status:r.status, remainingKm:r.remainingKm, dueDate:r.dueDate});
      }
    });
  });
  alerts.sort((a,b)=> (a.status==='due'?0:1) - (b.status==='due'?0:1));

  let alertsHtml = '';
  if(alerts.length===0){ alertsHtml = `<div class="empty">No hay mantenimientos próximos o vencidos. 👍</div>`; }
  else{
    alertsHtml = alerts.slice(0,6).map(a=>{
      const dotClass = a.status==='due' ? 'bad':'warn';
      let meta = '';
      if(a.remainingKm!=null) meta = a.remainingKm<=0 ? `Vencido por ${fmtKm(Math.abs(a.remainingKm))}` : `Faltan ${fmtKm(a.remainingKm)}`;

function monthlyChartData(carIds){
  const months = [];
  const now = new Date();
  for(let i=11;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label:d.toLocaleDateString('es-PY',{month:'short'}), total:0});
  }
  const map = {}; months.forEach(m=>map[m.key]=m);
  carIds.forEach(id=>{
    DB.fuel.filter(f=>f.carId===id).forEach(f=>{ const k=f.date.slice(0,7); if(map[k]) map[k].total+=Number(f.totalCost||0); });
    DB.expenses.filter(e=>e.carId===id).forEach(e=>{ const k=e.date.slice(0,7); if(map[k]) map[k].total+=Number(e.cost||0); });
  });
  return months;
}
function drawBarChart(canvas, data){
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth||300, h = 140;
  canvas.width = w*dpr; canvas.height = h*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  // Read live theme values
  const style = getComputedStyle(document.documentElement);
  const clrAccent = style.getPropertyValue('--accent').trim();
  const clrAccentDim = style.getPropertyValue('--accent-dim').trim();
  const clrEmpty = style.getPropertyValue('--panel-2').trim();
  const clrLabel = style.getPropertyValue('--text-dim').trim();
  const max = Math.max(...data.map(d=>d.total), 1);
  const padBottom = 20, padTop = 6;
  const barW = w/data.length;
  data.forEach((d,i)=>{
    const barH = ((h-padBottom-padTop) * (d.total/max));
    const x = i*barW + barW*0.22;
    const bw = barW*0.56;
    const y = h-padBottom-barH;
    const grad = ctx.createLinearGradient(0,y,0,h-padBottom);
    grad.addColorStop(0, clrAccent);
    grad.addColorStop(1, clrAccentDim);
    ctx.fillStyle = d.total>0 ? grad : clrEmpty;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x,y,bw,Math.max(barH,2),3) : ctx.rect(x,y,bw,Math.max(barH,2));
    ctx.fill();
    ctx.fillStyle = clrLabel;
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.label, x+bw/2, h-6);
  });
}

/* ============== CAR IMAGE HELPERS ============== */
function compressCarImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX_W=600, MAX_H=320;
      let w=img.naturalWidth, h=img.naturalHeight;
      if(w>MAX_W||h>MAX_H){ const r=Math.min(MAX_W/w,MAX_H/h); w=Math.round(w*r); h=Math.round(h*r); }
      const canvas=document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      // Keep PNG for transparency; fall back to JPEG if too large
      let b64 = canvas.toDataURL('image/png');
      if(b64.length>400000) b64 = canvas.toDataURL('image/jpeg',0.78);
      resolve(b64);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(); };
    img.src=url;
  });
}

/* ============== EXCEL IMPORT (FUEL) ============== */
let _pendingImportRows = [];
function normHeader(h){
  return String(h==null?'':h).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
const IMPORT_SYNONYMS = {
  date: ['fecha','date'],
  km: ['km','kilometraje','kilometros','odometro'],
  liters: ['litros','lts','litros cargados','l'],
  totalCost: ['total','costo','costo total','importe','monto','precio total','valor','gs'],
  pricePerLiter: ['precio/litro','preciolitro','precio por litro','p/l','precio litro','precio unitario'],
  station: ['estacion','estacion de servicio','lugar','surtidor','servicentro'],
  octane: ['octanaje','octanos','octano'],
  fullTank: ['tanque lleno','lleno','full','tanque'],
};
function findCol(headers, keys){
  for(let i=0;i<headers.length;i++){
    const h = normHeader(headers[i]);
    if(keys.includes(h)) return i;
  }
  return -1;
}
function parseNum(v){
  if(v==null || v==='') return null;
  if(typeof v==='number') return v;
  let s = String(v).trim();
  if(!s) return null;
  if(/^\d{1,3}(\.\d{3})+,\d+$/.test(s)){ s = s.replace(/\./g,'').replace(',','.'); }
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,''); }
  else if(/^\d+,\d+$/.test(s)){ s = s.replace(',','.'); }
  else { s = s.replace(/[^0-9.\-]/g,''); }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function parseExcelDate(v){
  if(v==null || v==='') return null;
  if(v instanceof Date) return v.toISOString().slice(0,10);
  if(typeof v==='number'){
    const ms = Math.round((v-25569)*86400*1000);
    const d = new Date(ms);
    if(isNaN(d)) return null;
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  const parsed = new Date(s);
  if(!isNaN(parsed)) return parsed.toISOString().slice(0,10);
  return null;
}
function parseFullTank(v){
  if(v==null || v==='') return true;
  if(typeof v==='boolean') return v;
  const s = String(v).toLowerCase().trim();
  return ['si','sí','x','full','lleno','1','true','yes'].includes(s);
}
function handleFuelImportFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ toast('Todavía se está cargando el lector de Excel, esperá un segundo e intentá de nuevo'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(rows.length<2){ toast('El archivo no tiene filas de datos'); return; }
      const headers = rows[0];
      const col = {
        date: findCol(headers, IMPORT_SYNONYMS.date),
        km: findCol(headers, IMPORT_SYNONYMS.km),
        liters: findCol(headers, IMPORT_SYNONYMS.liters),
        totalCost: findCol(headers, IMPORT_SYNONYMS.totalCost),
        pricePerLiter: findCol(headers, IMPORT_SYNONYMS.pricePerLiter),
        station: findCol(headers, IMPORT_SYNONYMS.station),
        octane: findCol(headers, IMPORT_SYNONYMS.octane),
        fullTank: findCol(headers, IMPORT_SYNONYMS.fullTank),
      };
      if(col.date===-1 || (col.liters===-1 && col.totalCost===-1)){
        toast('No se encontraron columnas de fecha/costo/litros reconocibles'); return;
      }
      const parsed = rows.slice(1).filter(r=>r.some(c=>c!=='')).map(r=>{
        const date = col.date>-1 ? parseExcelDate(r[col.date]) : null;
        let liters = col.liters>-1 ? parseNum(r[col.liters]) : null;
        let totalCost = col.totalCost>-1 ? parseNum(r[col.totalCost]) : null;
        const pricePerLiter = col.pricePerLiter>-1 ? parseNum(r[col.pricePerLiter]) : null;
        if(totalCost==null && liters!=null && pricePerLiter!=null) totalCost = Math.round(liters*pricePerLiter);
        if(liters==null && totalCost!=null && pricePerLiter!=null) liters = totalCost/pricePerLiter;
        const km = col.km>-1 ? parseNum(r[col.km]) : null;
        const station = col.station>-1 ? String(r[col.station]||'').trim() : '';
        const octane = col.octane>-1 ? parseNum(r[col.octane]) : null;
        const fullTank = col.fullTank>-1 ? parseFullTank(r[col.fullTank]) : true;
        const skip = !date || totalCost==null || liters==null;
        const isDup = !skip && DB.fuel.some(f=>f.date===date && f.km===km && Math.abs((f.liters||0)-(liters||0))<0.05);
        return {date, km, liters, totalCost, station, octane, fullTank, skip: skip||isDup, skipReason: skip?'datos insuficientes':(isDup?'duplicado':null)};
      });
      _pendingImportRows = parsed;
      showImportPreview();
    }catch(err){ console.error(err); toast('No se pudo leer el archivo'); }
  };
  reader.readAsArrayBuffer(file);
}
function showImportPreview(){
  const defaultCar = currentVehicleId || DB.cars[0]?.id;
  const okCount = _pendingImportRows.filter(r=>!r.skip).length;
  const skipCount = _pendingImportRows.length - okCount;
  const rowsHtml = _pendingImportRows.map(r=>`
    <tr class="${r.skip?'skip':''}">
      <td>${r.date||'—'}</td>
      <td>${r.km!=null?numFmt(r.km,0):'—'}</td>
      <td>${r.liters!=null?numFmt(r.liters,1):'—'}</td>
      <td>${r.totalCost!=null?numFmt(r.totalCost,0):'—'}</td>
      <td>${r.octane||'—'}</td>
      <td>${r.skip?(r.skipReason||'omitido'):'OK'}</td>
    </tr>`).join('');
  const html = `
    <div class="modal">
      <div class="modal-head"><h3>Importar combustible</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
      ${DB.cars.length>1?`<div class="field"><label>Asignar todas las filas al vehículo</label><select id="importCarId">${carOptionsHtml(defaultCar)}</select></div>`:`<input type="hidden" id="importCarId" value="${defaultCar}">`}
      <div class="import-summary"><span><b>${okCount}</b> se importarán</span><span><b>${skipCount}</b> se omiten</span></div>
      <div class="scrollx"><table class="import-table">
        <tr><th>Fecha</th><th>Km</th><th>Litros</th><th>Costo</th><th>Oct.</th><th>Estado</th></tr>
        ${rowsHtml}
      </table></div>
      <p class="help-text" style="margin-top:10px">Las filas tachadas se omiten por falta de datos o por ser posibles duplicados de cargas ya existentes.</p>
      <button class="btn btn-primary btn-block" ${okCount===0?'disabled':''} onclick="confirmFuelImport()">Importar ${okCount} carga(s)</button>
    </div>`;
  openModal(html);
}
function confirmFuelImport(){
  const carId = document.getElementById('importCarId').value;
  let count = 0;
  _pendingImportRows.forEach(r=>{
    if(r.skip) return;
    DB.fuel.push({
      id: uid(), carId, date: r.date, km: r.km, liters: r.liters, totalCost: Math.round(r.totalCost),
      octane: r.octane, fullTank: r.fullTank, station: r.station, notes: 'Importado desde Excel',
    });
    count++;
  });
  saveDB(); _pendingImportRows = []; closeModal(); toast(`${count} carga(s) importada(s)`); renderAll();
}

function saveExpense(entryId){
  const kmRaw = document.getElementById('f-km').value;
  const km = kmRaw==='' ? null : Number(kmRaw);
  const cost = Number(document.getElementById('f-cost').value);
  if(!cost){ toast('Completá el costo'); return; }
  const linkedMaintIds = Array.from(document.querySelectorAll('#maintCheckList input[type=checkbox]:checked')).map(i=>i.value);
  const data = {
    carId: document.getElementById('f-carId').value,
    category: document.getElementById('f-category').value,
    date: document.getElementById('f-date').value || todayStr(),
    km,
    description: document.getElementById('f-description').value.trim(),
    cost,
    notes: document.getElementById('f-notes').value.trim(),
    linkedMaintIds,
  };
  if(entryId){ const old=DB.expenses.find(e=>e.id===entryId); delete old.linkedMaintId; Object.assign(old, data); }
  else { DB.expenses.push(Object.assign({id:uid()}, data)); }

  linkedMaintIds.forEach(id=>{
    const item = DB.maint.find(m=>m.id===id);
    if(!item) return;
    if(data.km!=null && (item.lastDoneKm==null || data.km>item.lastDoneKm)) item.lastDoneKm = data.km;
    if(!item.lastDoneDate || data.date>item.lastDoneDate) item.lastDoneDate = data.date;
  });

}

function addStandardPlan(carId){

  {key:'instalado',     label:'Instalado en posición de conducción', hasPos:true,  active:true},
  {key:'movido',        label:'Movido a otra posición',               hasPos:true,  active:true},

function eventTypeMeta(key){ return EVENT_TYPES.find(e=>e.key===key)||{label:key,hasPos:false,active:false}; }

// ── Migration: convert old flat-field tires to event-history format ──────────
function migrateTires(){
  let changed = false;
  DB.tires = DB.tires.map(t=>{
    let updated = false;
    if(!Array.isArray(t.events)){
      const events = [];
      if(t.kmInstalled!=null || t.purchaseDate || t.position){
        events.push({id:uid(), date:t.purchaseDate||todayStr(), km:t.kmInstalled??null,
          type:'instalado', position:t.position||'Delantera izquierda'});
      }
      if(t.status==='retirado'){
        events.push({id:uid(), date:t.dateRetired||todayStr(), km:t.kmRetired??null,
          type:'retirado', position:null});
      }
      t = {id:t.id, carId:t.carId, brand:t.brand||'', model:t.model||'',
        size:t.size||'', cost:t.cost||0, purchaseDate:t.purchaseDate||null,
        notes:t.notes||'', events, flats:[]};
      updated = true;
    }
    if(!Array.isArray(t.flats)){ t.flats=[]; updated=true; }
    if(updated) changed=true;
    return t;
  });
  if(changed) saveDB();
}

function tiresByCar(carId){ return DB.tires.filter(t=>t.carId===carId); }

function tireEventsSorted(t){
  return (t.events||[]).slice().sort((a,b)=>{
    if((a.date||'') !== (b.date||'')) return (a.date||'') < (b.date||'') ? -1 : 1;
    return (a.km||0) - (b.km||0);
  });
}
function tireCurrentState(t){
  const evs = tireEventsSorted(t);
  return evs.length ? evs[evs.length-1] : null;
}
function tireStatusBadge(state){
  if(!state) return {label:'Sin eventos', cls:'', style:'background:color-mix(in srgb,var(--text-dim) 15%,transparent);color:var(--text-dim)'};
  const map = {
    instalado:     {label:'En uso', cls:'status-ok', style:''},
    movido:        {label:'En uso', cls:'status-ok', style:''},
    repuesto:      {label:'Repuesto', cls:'status-soon', style:''},
    retirado_temp: {label:'Retirado temp.', cls:'', style:'background:color-mix(in srgb,var(--text-dim) 15%,transparent);color:var(--text-dim)'},
    retirado:      {label:'Retirado', cls:'', style:'background:color-mix(in srgb,var(--text-dim) 15%,transparent);color:var(--text-dim)'},
  };
  return map[state.type] || {label:state.type, cls:'', style:''};
}
function tireKmActivos(t){
  const ACTIVE = new Set(['instalado','movido']);
  const evs = tireEventsSorted(t).filter(e=>e.km!=null);
  let total=0, activeFromKm=null;
  for(const ev of evs){
    if(ACTIVE.has(ev.type)){ if(activeFromKm===null) activeFromKm=ev.km; }
    else { if(activeFromKm!==null){ total+=Math.max(0,ev.km-activeFromKm); activeFromKm=null; } }
  }
  if(activeFromKm!==null){ const cur=carCurrentKm(t.carId); if(cur>activeFromKm) total+=cur-activeFromKm; }
  return total>0 ? total : (activeFromKm!=null ? 0 : null);
}

/* ============== RENDER: TRIPS (BICI) ============== */
function tripsByCar(carId){ return DB.trips.filter(t=>t.carId===carId); }
function placesByCar(carId){ return DB.places.filter(p=>p.carId===carId); }

function renderTrips(){
  const el = document.getElementById('sec-trips');
  if(!el) return;
  if(DB.cars.length===0){ el.innerHTML = noCarMsg(); return; }
  if(!currentVehicleId || vehicleType(currentVehicleId)!=='bici'){ el.innerHTML=''; return; }
  const carId = currentVehicleId;
  const car = getCar(carId);
  const trips = tripsByCar(carId).slice().sort((a,b)=>b.date<a.date?-1:1);
  const places = placesByCar(carId);
  const totalKm = trips.reduce((s,t)=>s+(t.roundTrip?2:1)*(t.km||0),0);
  const tripCount = trips.length;
  // Days with at least one trip
  const daySet = new Set(trips.map(t=>t.date));
  const avgPerDay = daySet.size>0 ? totalKm/daySet.size : 0;

  // Quick-tap place pills
  const pillsHtml = places.length ? `
    <div style="margin-bottom:14px">
      <div style="font-size:10.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;font-weight:600;margin-bottom:8px">Lugares rápidos — tap para registrar ida y vuelta hoy</div>
      ${places.map(p=>`<span class="place-pill" onclick="quickLogTrip('${p.id}')">
        ${escapeHtml(p.name)} <span class="km">${numFmt(p.km,1)} km ida</span>
      </span>`).join('')}
    </div>` : '';

  // Trip history grouped by month
  let lastMonth='', histHtml='';
  trips.forEach(t=>{
    const month = t.date?t.date.slice(0,7):'—';
    if(month!==lastMonth){
      const d=new Date(month+'-01');
      const monthTotal = trips.filter(x=>x.date&&x.date.slice(0,7)===month)
        .reduce((s,x)=>s+(x.roundTrip?2:1)*(x.km||0),0);
      histHtml+=`<div class="year-sep"><span class="y">${d.toLocaleDateString('es-PY',{month:'long',year:'numeric'})}</span><span class="t">${fmtKm(monthTotal)}</span></div>`;
      lastMonth=month;
    }
    const place = t.placeId ? places.find(p=>p.id===t.placeId) : null;
    const dest = place ? escapeHtml(place.name) : escapeHtml(t.customDest||'Sin destino');
    const kmTotal = (t.roundTrip?2:1)*(t.km||0);
    histHtml+=`<div class="row-item">
      <div class="row-main">
        <div class="l1">${dest}</div>
        <div class="l2">${fmtDate(t.date)}${t.roundTrip?' · ida y vuelta':''}${t.notes?' · '+escapeHtml(t.notes):''}</div>
      </div>
      <div class="row-cost">${fmtKm(kmTotal)}
        <span class="sub" style="cursor:pointer;text-decoration:underline" onclick="openTripForm('${t.id}')">editar</span>
      </div>
    </div>`;
  });

  el.innerHTML = `
    <div class="section-title"><h2>Viajes</h2></div>
    <div class="fab-row">
      <button class="btn btn-primary" style="flex:1" onclick="openTripForm()">+ Registrar viaje</button>
      <button class="btn btn-ghost" style="flex:0 0 auto" onclick="openPlaceManager()">Lugares</button>
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="label">Total km registrados</div><div class="value">${fmtKm(totalKm)}</div></div>
      <div class="stat"><div class="label">Km promedio por día</div><div class="value cool">${numFmt(avgPerDay,1)} km</div></div>
    </div>
    ${pillsHtml}
    <div class="card"><h3>Historial</h3>
      ${trips.length===0?'<div class="empty">Todavía no registraste viajes.</div>':histHtml}
    </div>`;
}

function quickLogTrip(placeId){
  const place = DB.places.find(p=>p.id===placeId); if(!place) return;
  const trip = {id:uid(), carId:currentVehicleId, date:todayStr(),
    placeId, customDest:'', km:place.km, roundTrip:true, notes:''};
  DB.trips.push(trip);
  saveDB(); toast('Viaje registrado · '+fmtKm(place.km*2)); renderAll();
}

function openTripForm(tripId){
  const trip = tripId ? DB.trips.find(t=>t.id===tripId) : null;
  const places = placesByCar(currentVehicleId||trip?.carId);
  const placeOpts = places.map(p=>`<option value="${p.id}" ${trip?.placeId===p.id?'selected':''}>${escapeHtml(p.name)} (${numFmt(p.km,1)} km)</option>`).join('');
  const html=`<div class="modal">
    <div class="modal-head"><h3>${trip?'Editar viaje':'Registrar viaje'}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="field"><label>Destino</label>
      <select id="f-placeId" onchange="onTripPlaceChange()">
        <option value="">— Destino personalizado —</option>
        ${placeOpts}
      </select>
    </div>
    <div id="f-customDestWrap" class="field" style="display:${(!trip||!trip.placeId)?'block':'none'}">
      <label>Nombre del destino</label>
      <input id="f-customDest" value="${escapeHtml(trip?.customDest||'')}" placeholder="Ej: Mercado Central">
    </div>
    <div class="field-row">
      <div class="field"><label>Fecha</label><input id="f-date" type="date" value="${trip?.date||todayStr()}"></div>
      <div class="field"><label>Km (ida)</label><input id="f-km" type="number" step="0.1" value="${trip?.km??''}"></div>
    </div>
    <div class="checkbox-field"><input type="checkbox" id="f-roundTrip" ${(!trip||trip.roundTrip)?'checked':''}><label for="f-roundTrip">Ida y vuelta (duplica los km)</label></div>
    <div class="field"><label>Notas</label><input id="f-notes" value="${escapeHtml(trip?.notes||'')}"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary btn-block" onclick="saveTrip('${tripId||''}')">Guardar</button>
      ${trip?`<button class="btn btn-danger" onclick="deleteTrip('${tripId}')">Eliminar</button>`:''}
    </div>
  </div>`;
  openModal(html);
  onTripPlaceChange();
}
function onTripPlaceChange(){
  const placeId = document.getElementById('f-placeId')?.value;
  const wrap = document.getElementById('f-customDestWrap');
  const kmInput = document.getElementById('f-km');
  if(wrap) wrap.style.display = placeId?'none':'block';
  if(placeId && kmInput){
    const place = DB.places.find(p=>p.id===placeId);
    if(place) kmInput.value = place.km;
  }
}
function saveTrip(tripId){
  const kmRaw=document.getElementById('f-km').value;
  const km=kmRaw===''?null:Number(kmRaw);
  if(!km){ toast('Ingresá los km del viaje'); return; }
  const placeId=document.getElementById('f-placeId').value||null;
  const data={
    carId:currentVehicleId||DB.cars[0]?.id,
    date:document.getElementById('f-date').value||todayStr(),
    placeId, customDest:document.getElementById('f-customDest')?.value.trim()||'',
    km, roundTrip:document.getElementById('f-roundTrip').checked,
    notes:document.getElementById('f-notes').value.trim(),
  };
  if(tripId){ Object.assign(DB.trips.find(t=>t.id===tripId),data); }
  else { DB.trips.push(Object.assign({id:uid()},data)); }
  saveDB(); closeModal(); toast('Viaje guardado'); renderAll();
}
function deleteTrip(tripId){
  DB.trips=DB.trips.filter(t=>t.id!==tripId);
  saveDB(); closeModal(); toast('Viaje eliminado'); renderAll();
}

/* ============== RENDER: BACKUP ============== */
function renderBackup(){
  const el = document.getElementById('sec-backup');
  const stats = `${DB.cars.length} vehículo(s), ${DB.fuel.length} carga(s) de combustible, ${DB.trips.length} viaje(s) en bici, ${DB.expenses.length} gasto(s), ${DB.maint.length} ítem(s) de mantenimiento, ${DB.tires.length} neumático(s)`;
  const currentTheme = localStorage.getItem(THEME_KEY)||'earthy';
  el.innerHTML = `
    <div class="section-title"><h2>Backup y configuración</h2></div>
    <div class="card">
      <h3>Apariencia</h3>
      <div class="theme-option ${currentTheme==='earthy'?'selected':''}" onclick="applyTheme('earthy',true);renderBackup();">
        <div class="theme-swatch earthy"></div>
        <div class="theme-option-text"><div class="t1">Chaco — tierra y campo</div><div class="t2">Crema, terracota y oliva · Fraunces</div></div>
      </div>
      <div class="theme-option ${currentTheme==='dark'?'selected':''}" onclick="applyTheme('dark',true);renderBackup();">
        <div class="theme-swatch dark"></div>
        <div class="theme-option-text"><div class="t1">Dashboard nocturno</div><div class="t2">Panel oscuro con acentos ámbar · Rajdhani</div></div>
      </div>
    </div>
    <div class="card">
      <h3>Datos actuales</h3>
      <p class="help-text">${stats}</p>
    </div>
    <div class="card">
      <h3>Exportar</h3>
      <p class="help-text">Descargá un archivo con todos tus datos. Guardalo en un lugar seguro (Drive, email, etc.) para no perder tu información si cambiás de celular o borrás el navegador.</p>
      <button class="btn btn-primary btn-block" onclick="exportData()">Exportar copia de seguridad</button>
    </div>
    <div class="card">
      <h3>Importar</h3>
      <p class="help-text">Restaurá datos desde un archivo exportado previamente. <b>Esto reemplaza todos los datos actuales.</b></p>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this.files[0])">
      <button class="btn btn-ghost btn-block" onclick="document.getElementById('importFile').click()">Importar copia de seguridad</button>
    </div>
  `;
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `autogestor_backup_${ts}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Copia exportada');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || !Array.isArray(parsed.cars)){ toast('Archivo inválido'); return; }
      if(!confirm('Esto reemplazará todos los datos actuales con el contenido del archivo. ¿Continuar?')) return;
      DB = Object.assign(defaultDB(), parsed);
      saveDB();
      currentVehicleId = null; initCurrentVehicle();
      toast('Datos importados correctamente');
      renderAll();
    }catch(err){ toast('No se pudo leer el archivo'); console.error(err); }
  };
  reader.readAsText(file);
}

/* ============== MASTER RENDER ============== */
function renderAll(){
  updateNavForVehicle();
  renderDashboard();
  renderCars();
  renderFuel();
  renderTrips();
  renderExpenses();
  renderMaint();
  renderBackup();
}
initCurrentVehicle();
updateNavForVehicle();
renderAll();

/* ============== DAILY AUTO-BACKUP ============== */
(function(){
  const BACKUP_KEY = 'autogestor_last_backup';
  const today = todayStr();
  const last = localStorage.getItem(BACKUP_KEY);
  if(last === today) return; // already backed up today
  if(DB.cars.length === 0) return; // nothing to back up

  let fired = false;
  function doBackup(){
    if(fired) return;
    fired = true;
    const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `autogestor_backup_${today}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    localStorage.setItem(BACKUP_KEY, today);
    toast('💾 Copia de seguridad automática descargada');
  }

  // Fire on first user interaction — required by mobile Chrome to allow downloads
  const EVENTS = ['pointerdown','click','keydown','touchstart'];
  function onInteraction(){
    EVENTS.forEach(ev => document.removeEventListener(ev, onInteraction, {capture:true}));
    doBackup();
  }
  EVENTS.forEach(ev => document.addEventListener(ev, onInteraction, {capture:true, once:true}));
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
